<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CEH 練習</title>
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <script>
    // 在樣式載入前套用主題，避免切換頁面時閃爍
    try {
      var settings = JSON.parse(localStorage.getItem('ceh.settings') || '{}');
      if (settings.theme === 'light' || settings.theme === 'dark') {
        document.documentElement.dataset.theme = settings.theme;
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">CEH 練習</a>
    <nav class="topnav" aria-label="主要導覽">
      <a href="#/study" data-nav="study">學習</a>
      <a href="#/drill" data-nav="drill">刷題</a>
      <a href="#/exam" data-nav="exam">模擬考</a>
      <a href="#/wrong" data-nav="wrong">錯題</a>
      <a href="#/vocab" data-nav="vocab">生字</a>
      <a href="#/settings" data-nav="settings">設定</a>
    </nav>
  </header>
  <main id="app" class="page"><p class="muted">載入題庫中…</p></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
